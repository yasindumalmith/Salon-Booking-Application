apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salon-gateway-ingress
  annotations:

    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /

    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  rules:
    - host: api.salonapp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 80
    - host: auth.salonapp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080