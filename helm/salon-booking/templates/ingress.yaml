{{- if .Values.ingress.enabled }}
# ──────────────────────────────────────────────────────────────
# Ingress — salon-gateway-ingress
# ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salon-gateway-ingress
  labels:
    {{- include "salon-booking.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/enable-cors: {{ .Values.ingress.corsEnabled | quote }}
spec:
  rules:
    - host: {{ .Values.ingress.apiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: {{ .Values.gateway.service.port }}
    - host: {{ .Values.ingress.authHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
{{- end }}
